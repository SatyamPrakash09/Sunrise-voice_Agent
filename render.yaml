services:
  # Sunrise Salon Voice Agent Backend (FastAPI + LiveKit Agent Worker)
  - type: web
    name: sunrise-salon-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run honcho start
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: LIVEKIT_AGENTS_PRELOAD_LOCAL_INFERENCE
        value: "0"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
